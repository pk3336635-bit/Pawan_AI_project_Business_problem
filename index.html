<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4a2c18" />
  <meta name="description" content="Mahalaxmi Sweets — order fresh mithai, snacks and chai online. Preorder festival packs for a pickup or delivery slot and skip the queue." />
  <title>Mahalaxmi Sweets — Fresh Mithai, Snacks &amp; Chai</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>

  <!-- Top strip: shop status + festival countdown -->
  <div class="topbar" id="topbar" data-role="topbar" aria-live="polite"></div>

  <!-- Header / navigation (rendered by js/components/navbar.js) -->
  <header class="site-header" id="site-header" data-role="navbar"></header>

  <!-- Routed page content (rendered by js/router.js) -->
  <main id="view" class="view" tabindex="-1"></main>

  <!-- Footer (rendered by js/components/footer.js) -->
  <footer class="site-footer" id="site-footer" data-role="footer"></footer>

  <!-- Sticky mobile cart summary -->
  <div class="mobile-cart-bar" id="mobile-cart-bar" hidden></div>

  <!-- Slide-in cart drawer -->
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Your cart" hidden></aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Generic modal host -->
  <div class="modal-host" id="modal-host" hidden></div>

  <!-- Toast notifications -->
  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
